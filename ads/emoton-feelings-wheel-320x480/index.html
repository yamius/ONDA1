<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Google Ads HTML5 required: declared creative size -->
<meta name="ad.size" content="width=320,height=480">
<meta name="viewport" content="width=320,height=480,initial-scale=1">
<!-- Google Ads click exit. The final URL is set in Google Ads UI and overrides
     this default; keep it as the fallback landing page. -->
<script type="text/javascript">var clickTag = "https://onda-life.com/emoton";</script>
<title>Emoton — Feelings Wheel</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:320px;height:480px;overflow:hidden}
  #stage{
    position:relative;width:320px;height:480px;cursor:pointer;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#050a0f;color:#fff;border:1px solid rgba(255,255,255,.10);
    background-image:
      radial-gradient(ellipse at 50% 28%,rgba(34,211,238,.14),transparent 55%),
      radial-gradient(ellipse at 50% 100%,rgba(74,222,128,.08),transparent 60%);
    overflow:hidden;user-select:none;
  }
  #rays{position:absolute;inset:0;width:320px;height:480px;opacity:0;transition:opacity .8s ease}
  .wm{position:absolute;top:18px;left:0;width:100%;text-align:center;font-size:10px;
    letter-spacing:.28em;font-weight:800;z-index:5}
  .wm .o{color:#4ade80}.wm .l{color:#22d3ee}.wm .d{opacity:.4;margin:0 .4em}
  /* orb */
  #orb{position:absolute;left:50%;top:200px;width:118px;height:118px;margin:-59px 0 0 -59px;
    border-radius:50%;border:1px solid rgba(125,211,252,.35);
    background:radial-gradient(circle at 50% 35%,rgba(34,211,238,.22),rgba(34,211,238,.04) 60%,transparent 72%);
    display:flex;align-items:center;justify-content:center;z-index:4;
    animation:breathe 5.5s ease-in-out infinite;box-shadow:0 0 38px rgba(34,211,238,.18)}
  #orb span{font-size:34px;font-weight:300;letter-spacing:.04em;color:rgba(255,255,255,.92)}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.055)}}
  /* zones */
  .zone{position:absolute;width:84px;margin:-15px 0 0 -42px;padding:7px 4px;border-radius:11px;
    border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);
    text-align:center;font-size:10px;line-height:1.15;font-weight:600;color:rgba(255,255,255,.82);
    z-index:6;opacity:0;transform:scale(.6);transition:opacity .4s ease,transform .4s ease,background .2s}
  .zone b{display:block;font-size:11px}
  .zone.show{opacity:1;transform:scale(1)}
  .zone:active{background:rgba(255,255,255,.14)}
  /* text + cta */
  #prompt{position:absolute;left:0;bottom:96px;width:100%;text-align:center;z-index:5;
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(34,211,238,.78)}
  #headline{position:absolute;left:0;top:300px;width:100%;text-align:center;z-index:5;
    font-size:22px;font-weight:700;opacity:0;transition:opacity .6s ease;padding:0 20px}
  #sub{position:absolute;left:0;top:338px;width:100%;text-align:center;z-index:5;
    font-size:12px;line-height:1.5;color:rgba(255,255,255,.6);opacity:0;transition:opacity .6s ease .15s;padding:0 30px}
  #cta{position:absolute;left:50%;bottom:34px;transform:translateX(-50%) translateY(8px);
    z-index:7;opacity:0;pointer-events:none;transition:opacity .5s ease .25s,transform .5s ease .25s;
    background:linear-gradient(135deg,#22d3ee,#4ade80);color:#04141a;font-weight:800;
    font-size:14px;letter-spacing:.01em;padding:13px 26px;border-radius:26px;white-space:nowrap;
    box-shadow:0 8px 26px rgba(34,211,238,.32)}
  .pill{position:absolute;left:0;bottom:84px;width:100%;text-align:center;z-index:5;opacity:0;
    transition:opacity .6s ease .1s;font-size:11px;color:rgba(255,255,255,.45)}
  /* states */
  #stage.s-wheel .zone{}
  #stage.s-result #orb{top:150px}
  #stage.s-result .zone{opacity:0!important;transform:scale(.4);pointer-events:none}
  #stage.s-result #prompt{opacity:0}
  #stage.s-result #rays{opacity:1}
  #stage.s-result #headline,#stage.s-result #sub,#stage.s-result .pill{opacity:1}
  #stage.s-result #cta{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);
    animation:ctaPulse 2.2s ease-in-out infinite}
  @keyframes ctaPulse{0%,100%{box-shadow:0 8px 26px rgba(34,211,238,.32)}50%{box-shadow:0 8px 34px rgba(34,211,238,.55)}}
  .tap{position:absolute;left:0;top:292px;width:100%;text-align:center;font-size:10px;
    letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.35);z-index:5;
    animation:blink 2s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.35}50%{opacity:.75}}
  #stage.s-wheel .tap,#stage.s-result .tap{display:none}
</style>
</head>
<body>
<div id="stage" class="s-intro">
  <canvas id="rays" width="320" height="480"></canvas>
  <div class="wm"><span class="o">ONDA</span><span class="d">·</span><span class="l">EMOTON</span></div>

  <div id="orb"><span>I</span></div>

  <div class="tap">tap to begin</div>
  <div id="prompt">What's most alive in you?</div>

  <div id="headline"></div>
  <div id="sub">Name what you feel — in under a minute. Free, no sign-up.</div>
  <div class="pill">the feelings wheel</div>
  <div id="cta">Try the feelings wheel →</div>
</div>

<script>
(function(){
  var stage=document.getElementById('stage');
  var orb=document.getElementById('orb');
  var prompt=document.getElementById('prompt');
  var headline=document.getElementById('headline');
  var cvs=document.getElementById('rays'), ctx=cvs.getContext('2d');

  // 6 emotion zones (label + ray colours), laid out hexagonally around the orb.
  var ZONES=[
    {t:'Calm',s:'present',  mid:'#2dd4bf',tip:'#7af0e0'},
    {t:'Joy',s:'uplift',    mid:'#ee8f1c',tip:'#ffc24d'},
    {t:'Anger',s:'pressure',mid:'#c0392b',tip:'#ef6a4d'},
    {t:'Anxiety',s:'fear',  mid:'#8a93d4',tip:'#c2c8f2'},
    {t:'Sadness',s:'grief', mid:'#6e74e6',tip:'#a9adf5'},
    {t:'Numb',s:'flat',     mid:'#9aa0aa',tip:'#cfd4dc'}
  ];
  var CX=160, CY=200, R=118;
  ZONES.forEach(function(z,i){
    var a=(-90+i*60)*Math.PI/180;
    var el=document.createElement('div');
    el.className='zone';
    el.style.left=(CX+R*Math.cos(a))+'px';
    el.style.top=(CY+R*Math.sin(a))+'px';
    el.innerHTML='<b>'+z.t+'</b>'+z.s;
    el.addEventListener('click',function(e){e.stopPropagation();pick(z);});
    stage.appendChild(el);
    z.el=el;
  });

  var state='intro', raf=0, rays=null, chosen=null;

  function toWheel(){
    if(state!=='intro')return;
    state='wheel'; stage.className='s-wheel';
    prompt.textContent='Tap what’s most alive';
    var zs=document.querySelectorAll('.zone');
    for(var i=0;i<zs.length;i++){ (function(el,d){setTimeout(function(){el.classList.add('show');},80+d*55);})(zs[i],i); }
  }

  // seeded-ish ray field for the result screen (cheap: ~130 rays on canvas)
  function buildRays(z){
    var arr=[], n=130, seed=42;
    function rnd(){ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; }
    for(var i=0;i<n;i++){
      arr.push({a:rnd()*Math.PI*2, len:46+rnd()*90, w:0.5+rnd()*1.1,
                ph:rnd()*Math.PI*2, sp:1.2+rnd()*2.2, r0:50+rnd()*7});
    }
    return {list:arr, mid:z.mid, tip:z.tip};
  }
  function draw(t){
    ctx.clearRect(0,0,320,480);
    if(!rays){return;}
    var cx=160, cy=150; // matches #orb top in result state
    ctx.globalCompositeOperation='lighter';
    for(var i=0;i<rays.list.length;i++){
      var r=rays.list[i];
      var tw=0.45+0.55*(0.5+0.5*Math.sin(t*0.001*r.sp+r.ph));
      var x0=cx+Math.cos(r.a)*r.r0, y0=cy+Math.sin(r.a)*r.r0;
      var x1=cx+Math.cos(r.a)*(r.r0+r.len), y1=cy+Math.sin(r.a)*(r.r0+r.len);
      var g=ctx.createLinearGradient(x0,y0,x1,y1);
      g.addColorStop(0,'rgba(0,0,0,0)');
      g.addColorStop(0.35,rays.mid);
      g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.strokeStyle=g; ctx.globalAlpha=tw*0.7; ctx.lineWidth=r.w;
      ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
    }
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
    raf=requestAnimationFrame(draw);
  }

  function pick(z){
    if(state==='result')return;
    state='result'; chosen=z;
    stage.className='s-result';
    orb.querySelector('span').textContent='I';
    headline.textContent='Me and my '+z.t.toLowerCase()+'.';
    headline.style.color='#fff';
    rays=buildRays(z);
    cancelAnimationFrame(raf); raf=requestAnimationFrame(draw);
  }

  function exitAd(){
    var u=(window.clickTag||'https://onda-life.com/emoton');
    window.open(u,'_blank');
  }

  // Interaction: tap anywhere advances intro→wheel; zones handled above;
  // on result, any tap (incl. CTA) exits to the click URL.
  stage.addEventListener('click',function(){
    if(state==='intro'){ toWheel(); return; }
    if(state==='result'){ exitAd(); }
  });
})();
</script>
</body>
</html>
