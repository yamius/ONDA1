<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Opening App Store… — ONDA Life</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Tracking redirect: should never be indexed by search engines -->
<meta name="robots" content="noindex, nofollow" />
<!-- Belt-and-braces redirect: HTTP-equiv refresh fires even with JS disabled -->
<meta http-equiv="refresh" content="1;url=https://track.tenjin.com/v0/click/dP34Jl7LL3ck8Yp8X91JGe" />
<link rel="canonical" href="https://onda-life.com/go" />
<style>
  html, body { background: #050a0f; color: #eaeaea; font-family: 'JetBrains Mono', ui-monospace, monospace; margin: 0; min-height: 100vh; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
  main { max-width: 360px; }
  h1 { font-size: 18px; font-weight: 500; letter-spacing: 0.04em; margin: 0 0 12px; }
  p { font-size: 13px; color: #9aa4b2; margin: 0 0 18px; line-height: 1.5; }
  a { color: #6ee7b7; text-decoration: none; border-bottom: 1px dashed currentColor; }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #6ee7b7; margin: 0 3px; animation: blink 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: .2s; }
  .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }
</style>
<!-- Meta Pixel — base code -->
<script>

n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];

'https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '2615262235497922');
fbq('track', 'PageView');
fbq('track', 'InitiateCheckout', {
  content_name: 'ONDA Life iOS App',

<!-- Reddit Pixel -->
<script>
!function(w,d){if(!w.rdt){var p=w.rdt=function(){p.sendEvent?p.sendEvent.apply(p,arguments):p.callQueue.push(arguments)};p.callQueue=[];var t=d.createElement("script");t.src="https://www.redditstatic.com/ads/pixel.js?pixel_id=a2_j1iw32mi5ccu",t.async=!0;var s=d.getElementsByTagName("script")[0];s.parentNode.insertBefore(t,s)}}(window,document);rdt('init','a2_j1iw32mi5ccu');rdt('track', 'PageVisit');
</script>
<!-- DO NOT MODIFY UNLESS TO REPLACE A USER IDENTIFIER -->
<!-- End Reddit Pixel -->
<!-- Reddit Lead — conversion proxy, mirrors the Meta InitiateCheckout above:
     fires on /go load (track first) before the redirect below navigates. -->
<script>rdt('track', 'Lead');</script>
<!-- JS redirect with a small delay so the pixel beacon has time to fire.
     Channel split: utm_source=reddit routes through the reddit_ads Tenjin
     link; all other traffic keeps the quiz_cta link. The <meta refresh>
     above stays statically on quiz_cta as the no-JS fallback (a JS-disabled
     visitor fires no pixel anyway, so they're already invisible to
     measurement — falling through to quiz_cta only slightly undercounts). -->
<script>
  (function () {
    var QUIZ = 'https://track.tenjin.com/v0/click/dP34Jl7LL3ck8Yp8X91JGe';
    var REDDIT = 'https://track.tenjin.com/v0/click/gmOJIvCGZqB4cBnIkpFQPZ';
    var target = QUIZ;
    try {
      if (new URLSearchParams(window.location.search).get('utm_source') === 'reddit') {
        target = REDDIT;
      }
    } catch (e) { /* URLSearchParams unsupported — keep quiz_cta */ }
    // Point the visible "tap here" fallback at the chosen target too.
    document.addEventListener('DOMContentLoaded', function () {
      var a = document.getElementById('tap-here');
      if (a) a.href = target;
    });
    setTimeout(function () {
      window.location.replace(target);
    }, 700);
  })();
</script>

<body>
<main>
  <h1>OPENING APP STORE<span class="dot"></span><span class="dot"></span><span class="dot"></span></h1>
  <p>Redirecting to ONDA Life on the App Store. If nothing happens, <a id="tap-here" href="https://track.tenjin.com/v0/click/dP34Jl7LL3ck8Yp8X91JGe">tap here</a>.</p>
</main>
</body>
