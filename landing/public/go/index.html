<!-- Reddit Lead — conversion proxy, mirrors the Meta InitiateCheckout above:

<script>rdt('track', 'Lead');</script>
<!-- JS redirect — hold navigation until the pixel scripts have loaded and
     flushed, so Meta InitiateCheckout / Reddit Lead actually send before we
     leave (a fixed 700ms outran pixel.js and dropped the events). Channel
     split: utm_source=reddit -> reddit_ads, else quiz_cta. The <meta refresh>
     above (4s) is the no-JS fallback and sits above the hard cap, so JS
     always wins for pixel-capable visitors. -->
<script>
  (function () {
    var QUIZ = 'https://track.tenjin.com/v0/click/dP34Jl7LL3ck8Yp8X91JGe';
    var REDDIT = 'https://track.tenjin.com/v0/click/gmOJIvCGZqB4cBnIkpFQPZ';
    var target = QUIZ;
    try {
      if (new URLSearchParams(window.location.search).get('utm_source') === 'reddit') {
        target = REDDIT;
      }
    } catch (e) { /* URLSearchParams unsupported — keep quiz_cta */ }

    var redirected = false;
    function go() {
      if (redirected) return;
      redirected = true;
      window.location.replace(target);
    }

    // Primary: window 'load' waits for the async pixel scripts to finish
    // (ad-blocked scripts resolve instantly, so those users still redirect
    // fast); +500ms lets the queued PageVisit / Lead / InitiateCheckout
    // beacons flush before we navigate away.
    if (document.readyState === 'complete') {
      setTimeout(go, 500);
    } else {
      window.addEventListener('load', function () { setTimeout(go, 500); });
    }

    // On DOM ready: point the visible "tap here" fallback at the chosen
    // target, and arm a hard cap (~2500ms) so a slow or hanging asset can
    // never strand the user.
    function onReady() {
      var a = document.getElementById('tap-here');
      if (a) a.href = target;
      setTimeout(go, 2500);
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', onReady);
    } else {
      onReady();
    }
  })();
</script>
