<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ONDA Life - Mindfulness Practices</title>
    <meta name="application-name" content="ONDA Life" />
    <meta property="og:title" content="ONDA Life" />
    <meta property="og:site_name" content="ONDA Life" />

    <!-- Cold-start visual continuity:
         iOS shows LaunchScreen.storyboard (Splash image, logo on white) until
         the WebView is ready. Then the WebView appears with empty <body> while
         the JS bundle loads, parses and the React tree mounts — that's the
         6-second "black screen" users see on first cold start. We mask it with
         an inline HTML splash that mirrors the native one (same logo, same
         layout). main.tsx removes it once React has rendered.

         The fade-out keeps the seam invisible: storyboard → HTML splash →
         live app, all on the same canvas, no jarring background flash. -->
    <style>
      html, body { background: #000; margin: 0; }
      #root { background: #000; min-height: 100vh; }
      #onda-boot-splash {
        position: fixed; inset: 0; z-index: 2147483647;
        background: #000;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 350ms ease-out;
      }
      #onda-boot-splash.onda-fade-out { opacity: 0; pointer-events: none; }
      .onda-boot-stage {
        position: relative;
        width: 56px; height: 56px;
        display: flex; align-items: center; justify-content: center;
      }
      .onda-boot-logo {
        width: 47px; height: 47px;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 2px 14px rgba(20, 130, 110, 0.45);
      }
      .onda-boot-ring {
        position: absolute; inset: 0;
        width: 56px; height: 56px;
        animation: onda-spin 1.2s linear infinite;
      }
      @keyframes onda-spin { to { transform: rotate(360deg); } }
    </style>

    <!-- Polyfill: crypto.randomUUID for Android WebView < API 31 -->
    <script>
      if (typeof crypto !== 'undefined' && !crypto.randomUUID) {
        crypto.randomUUID = function() {
          return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, function(c) {
            return (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16);
          });
        };
      }
    </script>

    <!-- Web-only analytics SDKs (gtag, Meta Pixel, AdSense, Airbridge web).
         These ONLY make sense when ONDA is served as a web page; in the
         Capacitor iOS/Android app they're duplicates of native plugins
         (Firebase Analytics, Airbridge native SDK 4.x) and just burn
         cold-start time on DNS+TLS+fetch for scripts that never have
         anything to do. WKWebView holds first paint until those finish
         loading — that was the real source of the 6-second cold-start
         black screen, not the JS bundle.

         The Capacitor WebView serves index.html from `capacitor://localhost`
         (iOS) or `https://localhost` (Android), so we use that to detect
         a native build and skip the web SDKs entirely. The same SDKs run
         normally on the public web build (vercel/netlify/etc.) where
         hostname is the real domain. -->
    <script>
      (function () {
        var host = window.location.hostname || '';
        var proto = window.location.protocol || '';
        var isCapacitor =
          proto === 'capacitor:' ||
          host === 'localhost' ||
          host === '127.0.0.1';
        if (isCapacitor) {
          // Stub so any code that references window.airbridge() doesn't throw.
          // Native Airbridge plugin handles the actual events on iOS/Android.
          if (typeof window.airbridge !== 'function') {
            window.airbridge = function () {};
            window.airbridge.queue = [];
          }
          // Same stubs for gtag/fbq.
          window.dataLayer = window.dataLayer || [];
          window.gtag = window.gtag || function () {};
          window.fbq = window.fbq || function () {};
          return;
        }

        // Web build only — load the SDKs.
        // Google Analytics (gtag).
        var gtagSrc = document.createElement('script');
        gtagSrc.async = true;
        gtagSrc.src = 'https://www.googletagmanager.com/gtag/js?id=G-LSLFKSZCD3';
        document.head.appendChild(gtagSrc);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', 'G-LSLFKSZCD3');

        // Meta Pixel.
        !(function (f, b, e, v, n, t, s) {
          if (f.fbq) return; n = f.fbq = function () {
            n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
          };
          if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0';
          n.queue = []; t = b.createElement(e); t.async = !0;
          t.src = v; s = b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t, s);
        })(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
        window.fbq('init', '2615262235497922');
        window.fbq('track', 'PageView');

        // Google AdSense.
        var ads = document.createElement('script');
        ads.async = true;
        ads.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3662704213347646';
        ads.crossOrigin = 'anonymous';
        document.head.appendChild(ads);

        // Airbridge web SDK.
        (function (a, i, r, b) {
          if (typeof a[b] === 'function') return;
          a[b] = function () { a[b].queue.push(arguments); };
          a[b].queue = []; a[b]._i = Date.now();
          var s = i.createElement('script');
          s.src = r; s.async = true;
          i.getElementsByTagName('head')[0].appendChild(s);
        })(window, document, 'https://sdk-scripts.airbridge.io/airbridge.js', 'airbridge');
        window.airbridge('init', {
          app: 'ondalife',
          webToken: '1efbd0e8973f417f9dd9b7f47ac6e7c9',
          utmParsing: true,
          cookieWindow: 30,
        });
      })();

      // Ранний обработчик deep link событий от Android WebView bridge.
      // Необходим здесь (в HTML, до загрузки бандла) потому что Android
      // может диспатчить событие до полной инициализации JS-бандла. Stub
      // выше гарантирует что window.airbridge() не упадёт в нативной сборке.
      window.addEventListener('airbridge-deeplink', function (e) {
        var url = e.detail && e.detail.url;
        if (!url) return;
        console.log('[Airbridge] Deep link received (early handler):', url);
        try {
          if (typeof window.airbridge === 'function') {
            window.airbridge('event', { category: 'airbridge', action: 'app_open', deeplink: url });
          }
        } catch (err) {
          console.warn('[Airbridge] Failed to forward deep link:', err);
        }
      });
    </script>
  </head>
  <body>
    <!-- Meta Pixel noscript -->
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=2615262235497922&ev=PageView&noscript=1"
    /></noscript>

    <!-- Boot splash — circular ONDA disc with a thin orbiting arc that spins
         around it while the JS bundle loads. Pure HTML+CSS, zero deps, paints
         on the WebView's very first frame. main.tsx fades it out once React
         has committed its initial render. -->
    <div id="onda-boot-splash" aria-hidden="true">
      <div class="onda-boot-stage">
        <img class="onda-boot-logo" src="/onda-logo.png" alt="" />
        <svg class="onda-boot-ring" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="onda-ring-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#7FE3C4" stop-opacity="1"/>
              <stop offset="100%" stop-color="#2EAA88" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <circle
            cx="28" cy="28" r="26"
            fill="none"
            stroke="url(#onda-ring-grad)"
            stroke-width="2"
            stroke-linecap="round"
            stroke-dasharray="48 117"
          />
        </svg>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Early debug logging for iOS white screen debugging
      console.log('[ONDA] HTML loaded, starting app...');
      window.ondaBootLog = [];
      window.ondaBootLog.push({ t: Date.now(), msg: 'HTML loaded' });
      
      window.onerror = function(msg, url, line, col, error) {
        window.ondaBootLog.push({ t: Date.now(), msg: 'ERROR: ' + msg, url: url, line: line });
        console.error('[ONDA BOOT ERROR]', msg, url, line, col, error);
        
        // Show error on white screen
        var root = document.getElementById('root');
        if (root && !root.innerHTML.trim()) {
          root.innerHTML = '<div style="padding:20px;color:#fff;background:#111827;min-height:100vh;font-family:sans-serif;">' +
            '<h1 style="color:#ef4444;">Boot Error</h1>' +
            '<p style="color:#fbbf24;">' + msg + '</p>' +
            '<p style="color:#9ca3af;font-size:12px;">at ' + url + ':' + line + '</p>' +
            '<pre style="color:#9ca3af;font-size:10px;white-space:pre-wrap;">' + (error && error.stack ? error.stack : 'No stack') + '</pre>' +
            '</div>';
        }
        return true;
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
