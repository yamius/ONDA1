name: Supabase - Apply Migrations (Manual)

# MANUAL ONLY - automatic migrations don't work well with existing projects
# To apply migrations: Run this workflow and provide the migration filename
on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'Migration filename (e.g., 20260105160000_create_app_events.sql)'
        required: true
      confirm:
        description: 'Type "apply" to confirm'
        required: true
        default: ''

jobs:
  migrate:
    name: Apply Single Migration
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'apply'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate migration file exists
        run: |
          if [ ! -f "supabase/migrations/${{ github.event.inputs.migration_file }}" ]; then
            echo "❌ Migration file not found: ${{ github.event.inputs.migration_file }}"
            exit 1
          fi
          echo "✅ Found migration: ${{ github.event.inputs.migration_file }}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link and apply migration
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          
          echo "Applying migration: ${{ github.event.inputs.migration_file }}"
          
          # Execute the SQL file directly
          supabase db execute --file "supabase/migrations/${{ github.event.inputs.migration_file }}"
          
          echo "✅ Migration applied successfully!"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
