name: Science content checks

# ONDA Science pages are written by Mistral, handed over by Yakiv and published to main by Claude Code
# (rules: landing/docs/science-pack/). This re-runs the gate whenever pages or facts change.
on:
  push:
    branches: [main]
    paths: ['landing/content/science/**', 'landing/src/data/science/**', 'landing/docs/science-pack/**']
  pull_request:
    branches: [main]
    paths: ['landing/content/science/**', 'landing/src/data/science/**', 'landing/docs/science-pack/**']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      # format, DOI/PMID exist (Crossref/PubMed), numbers only via {{fact:}}, banned wording, links
      - name: Science content gate
        run: npx tsx scripts/check-science-content.ts --publish
      - name: Facts doc in the pack is up to date
        run: npx tsx scripts/science-pack-facts.ts --check
