name: iOS - Build and Deploy to TestFlight

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build and Deploy iOS App
    runs-on: macos-15
    timeout-minutes: 90
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane
        run: gem install fastlane

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: Verify Xcode SDKs
        run: |
          echo "=== Xcode and SDK Info ==="
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install iOS/watchOS Platforms
        run: |
          echo "=== Running first launch setup ==="
          sudo xcodebuild -runFirstLaunch || true
          
          echo "=== Accepting Xcode license ==="
          sudo xcodebuild -license accept || true
          
          echo "=== Downloading iOS platform (with retry) ==="
          for i in 1 2 3; do
            echo "Attempt $i to download iOS platform..."
            if sudo xcodebuild -downloadPlatform iOS; then
              echo "iOS platform download succeeded"
              break
            else
              echo "iOS platform download failed (attempt $i), waiting 10s..."
              sleep 10
            fi
          done
          
          echo "=== Downloading watchOS platform (with retry) ==="
          for i in 1 2 3; do
            echo "Attempt $i to download watchOS platform..."
            if sudo xcodebuild -downloadPlatform watchOS; then
              echo "watchOS platform download succeeded"
              break
            else
              echo "watchOS platform download failed (attempt $i), waiting 10s..."
              sleep 10
            fi
          done
          
          echo "=== Verifying platforms installed ==="
          xcodebuild -showsdks
          
          echo "=== SDK Paths ==="
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk watchos --show-sdk-path
          
          # Critical: Test that xcodebuild can actually find iOS destination
          echo "=== Testing iOS destination availability ==="
          if xcodebuild -showdestinations -scheme App -workspace ios/App/App.xcworkspace 2>&1 | grep -q "platform:iOS"; then
            echo "SUCCESS: iOS destination available"
          else
            echo "WARNING: iOS destination may not be available, continuing anyway..."
          fi

      - name: Setup CocoaPods
        run: |
          # Fix Xcode 16 project format for CocoaPods compatibility
          echo "=== Fixing objectVersion for CocoaPods ==="
          sed -i '' 's/objectVersion = 70/objectVersion = 56/' ios/App/App.xcodeproj/project.pbxproj || true
          grep "objectVersion" ios/App/App.xcodeproj/project.pbxproj | head -1
          # Update gems
          gem install xcodeproj --no-document
          gem install cocoapods --no-document
          pod --version

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Verify watchOS App Icons
        run: |
          ICON_DIR="ios/App/watchkitapp Watch App/Assets.xcassets/AppIcon.appiconset"
          echo "=== Checking watchOS icons ==="
          ls -la "$ICON_DIR/"
          # Count icon files (should be 16)
          ICON_COUNT=$(ls "$ICON_DIR"/icon-*.png 2>/dev/null | wc -l)
          echo "Found $ICON_COUNT icon files"
          if [ "$ICON_COUNT" -lt 16 ]; then
            echo "ERROR: Expected 16 icons, found $ICON_COUNT"
            exit 1
          fi
          echo "All 16 icons present"

      - name: Create App Store Connect API Key
        run: |
          mkdir -p /Users/runner/private_keys
          KEY_FILE="/Users/runner/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          
          echo "=== Base64 secret info ==="
          echo "Base64 length: ${#APP_STORE_CONNECT_API_KEY_CONTENT} characters"
          echo "First 50 chars: ${APP_STORE_CONNECT_API_KEY_CONTENT:0:50}"
          
          echo "$APP_STORE_CONNECT_API_KEY_CONTENT" | base64 -d > "$KEY_FILE"
          
          echo "=== Verifying decoded API Key file ==="
          echo "File path: $KEY_FILE"
          echo "File size: $(wc -c < "$KEY_FILE") bytes"
          echo "Line count: $(wc -l < "$KEY_FILE")"
          echo "=== Full file content (masked middle) ==="
          head -2 "$KEY_FILE"
          echo "... (middle lines hidden) ..."
          tail -2 "$KEY_FILE"
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}

      - name: Configure Fastlane Match
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"

      - name: Unlock Keychain for codesigning
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security list-keychains -d user -s build.keychain
        
      - name: Build and Deploy to TestFlight
        timeout-minutes: 30
        run: cd fastlane && fastlane ios beta --verbose
        env:
          CI: "true"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
          FASTLANE_ITC_TEAM_ID: ${{ secrets.FASTLANE_ITC_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: /Users/runner/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            build/
          retention-days: 30
          if-no-files-found: warn

      - name: Clean up API Key
        if: always()
        run: rm -f /Users/runner/private_keys/AuthKey_*.p8
