name: iOS - Build and Deploy to TestFlight

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build and Deploy iOS App
    runs-on: macos-15
    timeout-minutes: 90
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane
        run: gem install fastlane

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: Verify Xcode SDKs
        run: |
          echo "=== Xcode and SDK Info ==="
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install iOS/watchOS Platforms
        run: |
          echo "=== Running first launch setup ==="
          sudo xcodebuild -runFirstLaunch || true
          
          echo "=== Checking if iOS platform is already installed ==="
          PLATFORM_DIR="/Applications/Xcode_16.1.app/Contents/Developer/Platforms/iPhoneOS.platform"
          if [ -d "$PLATFORM_DIR" ]; then
            echo "iOS platform already installed at $PLATFORM_DIR"
          else
            echo "=== Downloading iOS platform (required for Xcode 16+ on macos-15) ==="
            # Try download, continue on error (may already be installed differently)
            sudo xcodebuild -downloadPlatform iOS || echo "Download returned error, checking if already available..."
          fi
          
          echo "=== Checking if watchOS platform is already installed ==="
          WATCHOS_DIR="/Applications/Xcode_16.1.app/Contents/Developer/Platforms/WatchOS.platform"
          if [ -d "$WATCHOS_DIR" ]; then
            echo "watchOS platform already installed at $WATCHOS_DIR"
          else
            echo "=== Downloading watchOS platform ==="
            sudo xcodebuild -downloadPlatform watchOS || echo "Download returned error, checking if already available..."
          fi
          
          echo "=== Verifying SDKs are available ==="
          xcodebuild -showsdks
          
          # Check iOS SDK
          if xcrun --sdk iphoneos --show-sdk-path > /dev/null 2>&1; then
            echo "iOS SDK available: $(xcrun --sdk iphoneos --show-sdk-path)"
          else
            echo "ERROR: iOS SDK not found"
            exit 1
          fi
          
          # Check watchOS SDK
          if xcrun --sdk watchos --show-sdk-path > /dev/null 2>&1; then
            echo "watchOS SDK available: $(xcrun --sdk watchos --show-sdk-path)"
          else
            echo "ERROR: watchOS SDK not found"
            exit 1
          fi

      - name: Setup CocoaPods
        run: |
          # Fix Xcode 16 project format for CocoaPods compatibility
          echo "=== Fixing objectVersion for CocoaPods ==="
          sed -i '' 's/objectVersion = 70/objectVersion = 56/' ios/App/App.xcodeproj/project.pbxproj || true
          grep "objectVersion" ios/App/App.xcodeproj/project.pbxproj | head -1
          # Update gems
          gem install xcodeproj --no-document
          gem install cocoapods --no-document
          pod --version

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Generate watchOS App Icons (all required sizes)
        run: |
          ICON_DIR="ios/App/watchkitapp Watch App/Assets.xcassets/AppIcon.appiconset"
          SOURCE_ICON="$ICON_DIR/_ONDA_logo.png"
          
          if [ -f "$SOURCE_ICON" ]; then
            echo "=== Generating all watchOS icon sizes ==="
            
            # First, remove alpha channel from source
            echo "Removing alpha channel from source icon..."
            sips -s format jpeg -s formatOptions best "$SOURCE_ICON" --out "${SOURCE_ICON}.jpg"
            sips -s format png "${SOURCE_ICON}.jpg" --out "$SOURCE_ICON"
            rm -f "${SOURCE_ICON}.jpg"
            
            # Generate all required sizes (pixel dimensions = size * scale)
            declare -a SIZES=(
              "48:icon-48.png"    # 24x24@2x notificationCenter 38mm
              "55:icon-55.png"    # 27.5x27.5@2x notificationCenter 42mm  
              "58:icon-58.png"    # 29x29@2x companionSettings
              "87:icon-87.png"    # 29x29@3x companionSettings
              "80:icon-80.png"    # 40x40@2x appLauncher 38mm
              "88:icon-88.png"    # 44x44@2x appLauncher 40mm
              "92:icon-92.png"    # 46x46@2x appLauncher 41mm
              "100:icon-100.png"  # 50x50@2x appLauncher 44mm
              "102:icon-102.png"  # 51x51@2x appLauncher 45mm
              "108:icon-108.png"  # 54x54@2x appLauncher 49mm
              "172:icon-172.png"  # 86x86@2x quickLook 38mm
              "196:icon-196.png"  # 98x98@2x quickLook 42mm
              "216:icon-216.png"  # 108x108@2x quickLook 44mm
              "234:icon-234.png"  # 117x117@2x quickLook 45mm
              "258:icon-258.png"  # 129x129@2x quickLook 49mm
              "1024:icon-1024.png" # 1024x1024@1x marketing
            )
            
            for ENTRY in "${SIZES[@]}"; do
              SIZE="${ENTRY%%:*}"
              FILENAME="${ENTRY##*:}"
              echo "Creating ${SIZE}x${SIZE} -> $FILENAME"
              sips -z $SIZE $SIZE "$SOURCE_ICON" --out "$ICON_DIR/$FILENAME"
            done
            
            echo "=== Generated icons ==="
            ls -la "$ICON_DIR/"
          else
            echo "ERROR: Source icon not found at $SOURCE_ICON"
            exit 1
          fi

      - name: Create App Store Connect API Key
        run: |
          mkdir -p /Users/runner/private_keys
          KEY_FILE="/Users/runner/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          
          echo "=== Base64 secret info ==="
          echo "Base64 length: ${#APP_STORE_CONNECT_API_KEY_CONTENT} characters"
          echo "First 50 chars: ${APP_STORE_CONNECT_API_KEY_CONTENT:0:50}"
          
          echo "$APP_STORE_CONNECT_API_KEY_CONTENT" | base64 -d > "$KEY_FILE"
          
          echo "=== Verifying decoded API Key file ==="
          echo "File path: $KEY_FILE"
          echo "File size: $(wc -c < "$KEY_FILE") bytes"
          echo "Line count: $(wc -l < "$KEY_FILE")"
          echo "=== Full file content (masked middle) ==="
          head -2 "$KEY_FILE"
          echo "... (middle lines hidden) ..."
          tail -2 "$KEY_FILE"
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}

      - name: Configure Fastlane Match
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"

      - name: Unlock Keychain for codesigning
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security list-keychains -d user -s build.keychain
        
      - name: Build and Deploy to TestFlight
        timeout-minutes: 30
        run: cd fastlane && fastlane ios beta --verbose
        env:
          CI: "true"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
          FASTLANE_ITC_TEAM_ID: ${{ secrets.FASTLANE_ITC_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: /Users/runner/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            build/
          retention-days: 30
          if-no-files-found: warn

      - name: Clean up API Key
        if: always()
        run: rm -f /Users/runner/private_keys/AuthKey_*.p8
