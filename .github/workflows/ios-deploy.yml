name: iOS - Build and Deploy to TestFlight

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build and Deploy iOS App
    # macos-15 (Sequoia) has Xcode 26 pre-installed in 2026 GitHub Actions
    # runner images. If the build fails finding Xcode 26, switch to
    # `macos-26` once that label is GA on GitHub-hosted runners.
    runs-on: macos-15
    timeout-minutes: 90
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          # Remove old lockfile and install fresh (fixes version mismatch)
          rm -f package-lock.json
          npm install --package-lock-only
          npm ci

      - name: Build React app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BUILD_NUMBER: ${{ github.run_number }}
          VITE_COMMIT_HASH: ${{ github.sha }}
          VITE_BRANCH_NAME: ${{ github.ref_name }}
          # Sentry source map upload — see vite.config.ts
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_PROJECT: capacitor
          # Unique release per CI build so we can tell versions apart in Sentry.
          SENTRY_RELEASE: onda-life@1.0.1+${{ github.run_number }}
          # Same release string gets baked into the JS bundle so runtime
          # events tag themselves with a release that has source maps.
          VITE_SENTRY_RELEASE: onda-life@1.0.1+${{ github.run_number }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane
        run: gem install fastlane

      - name: Setup Xcode
        # ITMS-90725: starting 2026-04-28 App Store Connect requires
        # binaries built with Xcode 26 / iOS 26 SDK. Pinned to '26.0'
        # so we don't accidentally drift back to an older minor that
        # ships an older SDK.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Download iOS and watchOS Platforms with retry
        # Non-fatal — these downloads grab simulator runtimes we don't
        # actually use in this workflow (no `xcodebuild test`, no
        # `xcrun simctl` anywhere). The device-side SDK that the archive
        # step needs is already bundled with Xcode 26.0.1. We still try
        # to pull the simulators because future PRs may add tests, but
        # Apple's CDN occasionally flaps with 'Unable to connect to
        # simulator' and we don't want that to block a TestFlight ship.
        continue-on-error: true
        run: |
          download_platform() {
            local platform=$1
            local max_attempts=3
            local attempt=1

            while [ $attempt -le $max_attempts ]; do
              echo "Attempting to download $platform platform (attempt $attempt/$max_attempts)..."
              if sudo xcodebuild -downloadPlatform "$platform"; then
                echo "$platform platform download completed!"
                return 0
              else
                echo "Download failed for $platform, waiting 30 seconds before retry..."
                sleep 30
                attempt=$((attempt + 1))
              fi
            done

            echo "Failed to download $platform after $max_attempts attempts (non-fatal)"
            return 0
          }

          echo "=== Downloading iOS Platform ==="
          download_platform iOS

          echo ""
          echo "=== Downloading watchOS Platform ==="
          download_platform watchOS

      - name: Verify iOS SDK
        run: |
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks

      - name: Fix Xcode project format for CocoaPods
        run: |
          # Older xcodeproj/cocoapods couldn't read Xcode 15+ project format
          # (objectVersion 70+), so we used to sed it back to 56. Modern
          # cocoapods + xcodeproj gems handle objectVersion 70 and beyond
          # natively, so the rewrite is now best-effort: if any high
          # objectVersion is present and the gems still trip on it, drop to
          # 56 — but normally this is a no-op.
          sed -i '' -E 's/objectVersion = (7[0-9]|8[0-9]|9[0-9])/objectVersion = 56/' ios/App/App.xcodeproj/project.pbxproj || true
          gem update xcodeproj
          gem install cocoapods
          pod --version

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        # Запускаем pod install явно, чтобы гарантировать установку:
        # - TenjinSDK — нативная атрибуция, заменила Airbridge в 1.4.0.
        # - SentryCapacitor (нативный перехват OOM-краш-репортов).
        run: |
          cd ios/App
          echo "=== Updating CocoaPods repo and installing pods ==="
          pod install --repo-update
          echo "=== Podfile.lock contents after install ==="
          cat Podfile.lock | head -60

      - name: Verify native pods are present
        run: |
          cd ios/App
          echo "=== Checking Sentry pod ==="
          if ! grep -q -i "SentryCapacitor\|Sentry/" Podfile.lock; then
            echo "::warning::SentryCapacitor pod not detected. Native crashes won't reach Sentry."
          else
            echo "SentryCapacitor pod detected ✓"
          fi
          echo "=== Checking Tenjin pod ==="
          if ! grep -q -i "TenjinSDK" Podfile.lock; then
            echo "::error::TenjinSDK pod NOT found in Podfile.lock — attribution will not work!"
            exit 1
          else
            echo "TenjinSDK pod detected ✓"
          fi

      - name: Create App Store Connect API Key
        run: |
          mkdir -p /Users/runner/private_keys
          KEY_FILE="/Users/runner/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          
          echo "=== Base64 secret info ==="
          echo "Base64 length: ${#APP_STORE_CONNECT_API_KEY_CONTENT} characters"
          echo "First 50 chars: ${APP_STORE_CONNECT_API_KEY_CONTENT:0:50}"
          
          echo "$APP_STORE_CONNECT_API_KEY_CONTENT" | base64 -d > "$KEY_FILE"
          
          echo "=== Verifying decoded API Key file ==="
          echo "File path: $KEY_FILE"
          echo "File size: $(wc -c < "$KEY_FILE") bytes"
          echo "Line count: $(wc -l < "$KEY_FILE")"
          echo "=== Full file content (masked middle) ==="
          head -2 "$KEY_FILE"
          echo "... (middle lines hidden) ..."
          tail -2 "$KEY_FILE"
        env:
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}

      - name: Configure Git credentials for Match
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          
          # Validate secrets are set
          if [ -z "$MATCH_GIT_URL" ] || [ -z "$MATCH_GIT_BASIC_AUTHORIZATION" ]; then
            echo "ERROR: MATCH_GIT_URL or MATCH_GIT_BASIC_AUTHORIZATION is not set!"
            exit 1
          fi
          
          # Decode credentials
          DECODED=$(echo "$MATCH_GIT_BASIC_AUTHORIZATION" | base64 -d 2>/dev/null)
          GIT_USERNAME=$(echo "$DECODED" | cut -d: -f1)
          GIT_TOKEN=$(echo "$DECODED" | cut -d: -f2-)
          echo "Configuring git credentials for user: $GIT_USERNAME"
          
          # Quick API check to confirm token is valid
          REPO_PATH=$(echo "$MATCH_GIT_URL" | sed 's|https://github.com/||' | sed 's|\.git$||' | sed 's|/$||')
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Basic $MATCH_GIT_BASIC_AUTHORIZATION" \
            "https://api.github.com/repos/$REPO_PATH")
          echo "GitHub API check: $HTTP_CODE (200 = OK)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Token cannot access '$REPO_PATH' (HTTP $HTTP_CODE)"
            echo "Regenerate: echo -n 'yamius:ghp_TOKEN' | base64 → update MATCH_GIT_BASIC_AUTHORIZATION"
            exit 1
          fi
          
          # Configure git credential store so Fastlane Match can clone without issues
          git config --global credential.helper store
          echo "https://${GIT_USERNAME}:${GIT_TOKEN}@github.com" >> ~/.git-credentials
          chmod 600 ~/.git-credentials
          echo "Git credentials configured successfully"
          
          # Also rewrite URL so git always uses credentials (most reliable approach)
          git config --global url."https://${GIT_USERNAME}:${GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
          echo "Git URL rewrite configured for github.com"
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}

      - name: Unlock Keychain for codesigning
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security list-keychains -d user -s build.keychain
        
      - name: Build and Deploy to TestFlight
        timeout-minutes: 30
        run: cd fastlane && fastlane ios beta --verbose
        env:
          CI: "true"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
          FASTLANE_ITC_TEAM_ID: ${{ secrets.FASTLANE_ITC_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: /Users/runner/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            build/
          retention-days: 30
          if-no-files-found: warn

      - name: Clean up API Key
        if: always()
        run: rm -f /Users/runner/private_keys/AuthKey_*.p8
