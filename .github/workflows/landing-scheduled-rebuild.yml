# Rebuilds onda-life.com every day so date-gated releases (article release queue,
# science rollout, review drips) go live on their date even when nobody pushes.
# Needs the repo secret VERCEL_DEPLOY_HOOK_LANDING (Vercel → landing project →
# Settings → Git → Deploy Hooks, branch main). Without the secret the job is a no-op.
name: landing-scheduled-rebuild

on:
  schedule:
    - cron: '15 4 * * *' # daily, 04:15 UTC
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_LANDING }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK_LANDING is not set — skipping."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
