# Deploys the onda-chatgpt project (MCP server behind onda-life.com/mcp) ONLY when chatgpt-app/ changes.
# Vercel's own git deploys are off for that project (chatgpt-app/vercel.json git.deploymentEnabled.main = false):
# every push to main used to create an (ignored) onda-chatgpt deployment and use up the Vercel deployment limit.
# Needs the repo secret VERCEL_DEPLOY_HOOK_MCP (Vercel → onda-chatgpt → Settings → Git → Deploy Hooks, branch main).
# Without the secret the job FAILS on purpose, so an MCP change never silently stays undeployed.
name: mcp-deploy

on:
  push:
    branches: [main]
    paths: ['chatgpt-app/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger onda-chatgpt deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_MCP }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK_MCP is not set — chatgpt-app/ changed but onda-chatgpt was NOT deployed."
            exit 1
          fi
          curl -fsS -X POST "$HOOK"
